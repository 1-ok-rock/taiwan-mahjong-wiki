<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12-slide teaching presentation — Taiwanese Mahjong</title><style>body{margin:0;background:#071323;color:#f2f7ff;font:18px/1.55 system-ui}a{color:#8bedd0}header{padding:16px 5%;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid #334b63}nav a{margin-left:18px}.deck{box-sizing:border-box;background:linear-gradient(130deg,#1b3854,#101a32);border:1px solid #38536c;border-radius:22px;min-height:65vh;margin:3% auto 0;max-width:1090px;padding:clamp(28px,6vw,78px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#8bedd0;letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-weight:800}h1{font-size:clamp(35px,6vw,69px);max-width:950px;line-height:1.12}.lead{font-size:clamp(19px,2.5vw,29px)}.note{color:#b7cbdc}.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:18px auto 40px;max-width:1090px}button{border-radius:10px;background:#24405b;color:#fff;border:1px solid #60849b;padding:14px 23px;cursor:pointer;font:inherit}button:hover{border-color:#8bedd0}.evidence{font-size:14px;color:#8bedd0;margin-top:30px}.bar{height:6px;background:#26364c;border-radius:10px;margin-top:20px}.bar i{display:block;height:100%;background:#8bedd0;border-radius:10px;width:0}footer{padding:24px 5%;color:#aabdcf}</style></head><body><header><b>◈ TAIWANESE MAHJONG · ENGLISH LESSON</b><nav><a href="index.html">Wiki</a><a href="presentation.html">Slides</a><a href="workflow.html">Workflow</a></nav></header><main><section class="deck" aria-live="polite"><div class="eyebrow" id="section">LESSON</div><h1 id="title">Taiwanese Mahjong</h1><p class="lead" id="body"></p><p class="note" id="note"></p><p class="evidence" id="sources"></p><div class="bar"><i id="bar"></i></div></section><div class="controls"><button onclick="change(-1)">← Previous</button><span id="count">1 / 12</span><button onclick="change(1)">Next →</button></div></main><footer><p><a href="v2/presentation.html">New lesson generated directly from the AI-authored Wiki →</a></p>Use the left/right arrow keys to change slides. Return to <a href="index.html">the evidence-linked Wiki</a>.</footer><script>const data=[["Welcome to Taiwanese Mahjong","Learn the essential ideas of the 16-tile version.","5 sets + 1 pair; 144 tiles; 4 players.","S01 S02 S03"],["The winning equation","5 sets of 3 tiles + 1 pair of 2 tiles = 17 structural tiles.","A kong is four physical tiles but counts as one set.","S01 S02 S03 S05"],["Learn the tile families","The three numbered suits are Characters, Dots and Bamboo.","Honors are Winds and Dragons; bonus tiles are Flowers and Seasons.","S02 S03 S05"],["The draw–discard turn","Ordinarily you hold 16 tiles between turns; after drawing, discard one.","The dealer starts with 17 tiles and discards first.","S02 S05"],["Chow / Chi","Three consecutive numbers from the same suit form a chow.","Example: Bamboo 4, 5 and 6. A chow is normally claimed only from the previous player's discard.","S01 S04 S05"],["Pung / Pong","Three identical tiles form a pung.","Example: East, East, East. A matching discard can complete a pung.","S01 S04 S05"],["Kong","Four identical tiles form a kong, counted as a single set.","After a declared kong you draw a replacement tile.","S02 S04 S05"],["Flower replacement","Reveal a drawn Flower or Season and take a replacement tile.","Flowers are bonus tiles, not part of the regular winning sets.","S02 S04 S05"],["Example of a win","Characters 1-2-3 · Characters 5-5-5 · Dots 4-5-6 · Bamboo 7-8-9 · East-East-East · Red Dragon pair.","Five groups of three plus one pair makes 17.","S01 S02 S03 S05"],["Watch out for house rules","Scoring conventions differ, including minimum tai and payment methods.","Agree on a ruleset before playing; don't assume one platform's table is universal.","S01 S02 S03 S05"],["Quick quiz","Q1: How many structural tiles at a normal win? Q2: Can you chow Winds? Q3: What follows a Flower draw?","Answers: 17; No; Reveal the Flower and draw a replacement tile.","S01 S02 S05"],["How we verified this lesson","Each slide cites the five-source Wiki; the workflow checks evidence before generation.","Read the Wiki and validation log to see why variation is acknowledged.","S01 S02 S03 S04 S05"]];let index=0;function draw(){const s=data[index];document.querySelector('#section').textContent='LESSON '+String(index+1).padStart(2,'0')+' / 12';document.querySelector('#title').textContent=s[0];document.querySelector('#body').textContent=s[1];document.querySelector('#note').textContent=s[2];document.querySelector('#sources').innerHTML='Wiki evidence: '+s[3].split(' ').map(x=>'<a href="index.html#'+x+'">'+x+'</a>').join(' · ');document.querySelector('#count').textContent=(index+1)+' / '+data.length;document.querySelector('#bar').style.width=((index+1)/data.length*100)+'%'}function change(d){index=Math.max(0,Math.min(data.length-1,index+d));draw()}addEventListener('keydown',e=>{if(e.key==='ArrowRight')change(1);if(e.key==='ArrowLeft')change(-1)});draw();</script></body></html>
